name: Validar candidato
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit
      - name: QA em navegador (tela cheia excluída explicitamente)
        timeout-minutes: 45
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/rift-browser-artifacts
        run: bash scripts/ci-browser.sh
      - name: Guardar evidências do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: ${{ runner.temp }}/rift-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
